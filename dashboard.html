<script>
/* ==========================================
   IAMVI LEADS — DASHBOARD SYSTEM
========================================== */

let allLeads = [];


/* ==========================================
   LOAD SAVED SEARCH RESULTS
========================================== */

document.addEventListener("DOMContentLoaded", function () {

    const storedResults =
        sessionStorage.getItem("iamviSearchResults");

    if (storedResults) {

        try {

            const results =
                JSON.parse(storedResults);

            if (Array.isArray(results) && results.length > 0) {

                allLeads = results;

                renderDashboardLeads(allLeads);

                updateStats();

            }

        } catch (error) {

            console.log("Unable to load search results.");

        }

    }

    loadSavedLeads();

});


/* ==========================================
   RENDER LEADS
========================================== */

function renderDashboardLeads(leads) {

    const container =
        document.getElementById("dashboardLeads");

    if (!container) return;


    if (leads.length === 0) {

        container.innerHTML = `
            <div style="
                padding:50px;
                text-align:center;
                color:#777;
            ">
                No leads found.
            </div>
        `;

        return;
    }


    container.innerHTML =
        leads.map((lead, index) => {

            const status =
                lead.status || "New";

            const statusClass =
                status === "Hot Lead"
                    ? "hot"
                    : status === "Warm"
                    ? "warm"
                    : "new";


            const icon =
                getBusinessIcon(lead.category);


            return `
                <div
                    class="lead-item"
                    data-status="${statusClass}"
                    data-index="${index}"
                >

                    <div class="lead-business">

                        <div class="lead-icon">
                            ${icon}
                        </div>

                        <div>

                            <strong>
                                ${lead.name}
                            </strong>

                            <small>
                                ${lead.email || "No email available"}
                            </small>

                        </div>

                    </div>

                    <span>
                        ${lead.category}
                    </span>

                    <span>
                        ${lead.location}
                    </span>

                    <span>
                        ${lead.phone || "No phone"}
                    </span>

                    <span class="status ${statusClass}">
                        ${status}
                    </span>

                    <div class="lead-actions">

                        <button
                            class="action-btn"
                            onclick="saveLead(${index}, this)"
                            title="Save lead"
                        >
                            ☆
                        </button>

                        <button
                            class="action-btn"
                            onclick="contactLead('${lead.phone || ""}')"
                            title="Contact"
                        >
                            ☎
                        </button>

                    </div>

                </div>
            `;

        }).join("");

}


/* ==========================================
   SAVE LEAD
========================================== */

function saveLead(index, button) {

    const lead = allLeads[index];

    if (!lead) return;


    let saved =
        JSON.parse(
            localStorage.getItem("iamviSavedLeads") || "[]"
        );


    const exists =
        saved.some(
            item => item.name === lead.name
        );


    if (exists) {

        saved =
            saved.filter(
                item => item.name !== lead.name
            );

        button.textContent = "☆";
        button.classList.remove("saved");

    } else {

        saved.push(lead);

        button.textContent = "★";
        button.classList.add("saved");

    }


    localStorage.setItem(
        "iamviSavedLeads",
        JSON.stringify(saved)
    );


    updateStats();

}


/* ==========================================
   LOAD SAVED LEADS
========================================== */

function loadSavedLeads() {

    const saved =
        JSON.parse(
            localStorage.getItem("iamviSavedLeads") || "[]"
        );


    const savedButtons =
        document.querySelectorAll(
            ".action-btn:first-child"
        );


    saved.forEach(savedLead => {

        allLeads.forEach((lead, index) => {

            if (
                lead.name === savedLead.name &&
                savedButtons[index]
            ) {

                savedButtons[index].textContent = "★";

                savedButtons[index]
                    .classList.add("saved");

            }

        });

    });

}


/* ==========================================
   FILTER
========================================== */

function filterLeads(status, button) {

    const buttons =
        document.querySelectorAll(".filter-btn");


    buttons.forEach(btn =>
        btn.classList.remove("active")
    );


    button.classList.add("active");


    if (status === "all") {

        renderDashboardLeads(allLeads);

    } else {

        const filtered =
            allLeads.filter(lead => {

                const leadStatus =
                    lead.status || "New";

                if (status === "hot")
                    return leadStatus === "Hot Lead";

                if (status === "warm")
                    return leadStatus === "Warm";

                if (status === "new")
                    return leadStatus === "New";

                return true;

            });


        renderDashboardLeads(filtered);

    }


    loadSavedLeads();

}


/* ==========================================
   DASHBOARD SEARCH
========================================== */

function dashboardSearch() {

    const business =
        document
            .getElementById("dashboardBusiness")
            .value
            .trim();

    const location =
        document
            .getElementById("dashboardLocation")
            .value
            .trim();


    if (!business || !location) {

        alert(
            "Enter both a business type and location."
        );

        return;

    }


    /*
       For now this reads the demo data
       from the homepage search.
    */

    const stored =
        sessionStorage.getItem(
            "iamviSearchResults"
        );


    if (stored) {

        const results =
            JSON.parse(stored);

        allLeads = results;

        renderDashboardLeads(allLeads);

    }


    sessionStorage.setItem(
        "iamviSearchType",
        business
    );

    sessionStorage.setItem(
        "iamviSearchLocation",
        location
    );


    updateStats();

}


/* ==========================================
   CONTACT LEAD
========================================== */

function contactLead(phone) {

    if (!phone) {

        alert(
            "This lead does not have a phone number."
        );

        return;

    }


    const cleanNumber =
        phone.replace(/\D/g, "");


    const whatsappURL =
        "https://wa.me/" + cleanNumber;


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* ==========================================
   EXPORT CSV
========================================== */

function exportLeads() {

    const saved =
        JSON.parse(
            localStorage.getItem(
                "iamviSavedLeads"
            ) || "[]"
        );


    const leads =
        saved.length > 0
            ? saved
            : allLeads;


    if (leads.length === 0) {

        alert(
            "There are no leads to export."
        );

        return;

    }


    const header = [
        "Business",
        "Category",
        "Location",
        "Phone",
        "Email",
        "Rating",
        "Status"
    ];


    const rows =
        leads.map(lead => [

            lead.name || "",
            lead.category || "",
            lead.location || "",
            lead.phone || "",
            lead.email || "",
            lead.rating || "",
            lead.status || ""

        ]);


    const csv =
        [header, ...rows]
            .map(row =>
                row.map(value =>
                    `"${String(value)
                        .replace(/"/g, '""')}"`
                ).join(",")
            )
            .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;
    link.download = "iamvi-leads.csv";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


/* ==========================================
   BUSINESS ICON
========================================== */

function getBusinessIcon(category) {

    const icons = {

        "Hotel": "🏨",
        "Restaurant": "🍽️",
        "Salon": "💇",
        "Car Dealer": "🚗",
        "Fashion": "👕",
        "Technology": "💻",
        "Events": "🎉"

    };

    return icons[category] || "🏢";

}


/* ==========================================
   STATISTICS
========================================== */

function updateStats() {

    const saved =
        JSON.parse(
            localStorage.getItem(
                "iamviSavedLeads"
            ) || "[]"
        );


    const statCards =
        document.querySelectorAll(
            ".stat-card h2"
        );


    if (statCards.length >= 4) {

        statCards[0].textContent =
            allLeads.length;

        statCards[1].textContent =
            saved.length;

        statCards[2].textContent =
            Math.min(
                saved.length,
                31
            );

        statCards[3].textContent =
            allLeads.filter(
                lead =>
                    lead.status === "Hot Lead"
            ).length;

    }

}
</script>
